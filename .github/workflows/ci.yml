name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            justfile
      - uses: extractions/setup-just@v4
      - run: just build lint

  # The integration tests drive the real ansible-playbook, so they run once per
  # supported ansible-core. Each version gets a controller Python it supports.
  test:
    name: test (ansible-core ${{ matrix.ansible }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ansible: "2.17"
            spec: "~=2.17.0"
            python: "3.12"
          - ansible: "2.19"
            spec: "~=2.19.0"
            python: "3.13"
          - ansible: latest
            spec: ""
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            justfile
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ matrix.python }}
      - run: pipx install --python "${{ steps.python.outputs.python-path }}" "ansible-core${{ matrix.spec }}"
      - run: command -v /usr/sbin/sshd || sudo apt-get install -y openssh-server
      - uses: extractions/setup-just@v4
      - run: just test
      - run: just test-ssh
