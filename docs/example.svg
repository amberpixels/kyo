  <text x="36" y="132"><tspan fill="#adbac7">  </tspan><tspan fill="#F59E0B">~</tspan><tspan fill="#adbac7"> [app] Write the app config     </tspan><tspan fill="#768390">(diff: +4 -1)</tspan></text>
